name: Release Workflow

on:
  push:
    branches: [development, release-0.*]
  workflow_dispatch:
    inputs:
      promote:
        type: boolean
        default: false
        description: Promote release to stable (for release-0.* branches only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    uses: tataranovich/ai-dial-ci/.github/workflows/node_release.yml@main
    with:
      promote: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
      node-version: 24
      # maximize-build-space: true
      draft-stable-releases: true
      filter-version: '0\.[0-9]+'
      # Disable long running parts
      docker-build-enabled: true
      publish-enabled: false
      ort-enabled: false
      style-checks-enabled: false
      code-checks-enabled: false
    secrets: inherit
